<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>NEXUS — by Cozanet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEXUS" />
    <meta name="theme-color" content="#5B3CF5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEXUS" />
    <meta name="theme-color" content="#5B3CF5" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var d = document.getElementById('aegis-err');
        if (!d) {
          d = document.createElement('pre');
          d.id = 'aegis-err';
          d.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#1a0000;color:#ff6b6b;padding:20px;z-index:99999;font-size:12px;white-space:pre-wrap;overflow:auto;font-family:monospace';
          document.body.appendChild(d);
          document.getElementById('root').style.display='none';
        }
        d.textContent += 'ERROR: ' + msg + '\nSource: ' + src + ':' + line + '\n' + (err && err.stack || '') + '\n\n';
      };
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.getElementById('aegis-err');
        if (!d) {
          d = document.createElement('pre');
          d.id = 'aegis-err';
          d.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#1a0000;color:#ff6b6b;padding:20px;z-index:99999;font-size:12px;white-space:pre-wrap;overflow:auto;font-family:monospace';
          document.body.appendChild(d);
          document.getElementById('root').style.display='none';
        }
        d.textContent += 'UNHANDLED REJECTION: ' + String(e.reason) + '\n' + (e.reason && e.reason.stack || '') + '\n\n';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
